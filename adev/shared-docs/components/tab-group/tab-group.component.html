<div ngTabs>
  <div ngTabList class="docs-tab-list" [(selectedTab)]="selectedTab">
    @for (tab of computedTabs(); track tab.value) {
      <div ngTab [value]="tab.value" class="docs-tab">
        {{ tab.label }}
      </div>
    }
  </div>

  @for (tab of computedTabs(); track tab.value) {
    <div ngTabPanel [preserveContent]="true" [value]="tab.value" class="docs-tab-panel" #tabpanel></div>
  }
</div>
